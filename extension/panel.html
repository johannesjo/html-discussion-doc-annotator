<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Decision notes</title>
<style>body{font:14px/1.4 sans-serif;margin:1em}button{margin:.25em 0;display:block}</style>
<h1>Decision notes</h1>
<p>Notes folder: <strong id="folder">…</strong></p>
<p id="access"></p>
<button id="continue" type="button" hidden>Continue in this folder</button>
<button id="choose" type="button">Choose folder…</button>
<p id="page"></p>
<p><small>While this panel is open, notes are on for the page you look at. Press <kbd>N</kbd> with the mouse over a spot, or use <b>+ Note</b>. Drag a note by its bar.</small></p>
<script type="module" src="panel.js"></script>
</html>
